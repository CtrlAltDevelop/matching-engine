# The gate in front of main. The checks themselves live in
# CtrlAltDevelop/ci-workflows, so every project runs the same ones.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  backend:
    name: Backend
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/python-backend.yml@v1.1.1
    permissions:
      contents: read
    with:
      python-version: "3.14"
      # Runtime pins from `make requirements` (uv export). The project itself
      # is installed below, not listed there, so pip-audit only audits what
      # comes from PyPI.
      requirements: requirements.txt
      # The engine keeps its state in files: no database, no cache.
      postgres: false
      redis: false
      mypy: true
      test-requirements: "pytest hypothesis httpx2 sortedcontainers-stubs -e ."

  security:
    name: Security
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/security.yml@v1.1.1
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      languages: '["python"]'
